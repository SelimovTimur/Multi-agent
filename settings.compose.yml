# Сгенерировано из settings.py; вручную не редактировать.
services:
  api:
    environment:
      PORT: "${PORT-8080}"
      METRICS_ADDR: "${METRICS_ADDR-127.0.0.1:9091}"
      LLM_SERVICE_URL: "${LLM_SERVICE_URL-http://llm:8000}"
      ASR_SERVICE_URL: "${ASR_SERVICE_URL-http://asr:8000}"
      TTS_SERVICE_URL: "${TTS_SERVICE_URL-http://tts:8000}"
      MAX_CONCURRENT_ASR: "${MAX_CONCURRENT_ASR-4}"
      MAX_CONCURRENT_TTS: "${MAX_CONCURRENT_TTS-2}"
      OPENAI_API_KEY: "${OPENAI_API_KEY-}"
      APP_ENV: "${APP_ENV-dev}"
      LOG_FORMAT: "${LOG_FORMAT-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME-На родном}"
      LOG_LEVEL: "${LOG_LEVEL-info}"
      AUTH_SESSION_COOKIE: "${AUTH_SESSION_COOKIE-nr_session}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN-}"
      AUTH_STUDENT_COOKIE: "${AUTH_STUDENT_COOKIE-nr_student}"
      PUBLIC_URL: "${PUBLIC_URL-http://localhost:3000}"
      SMTP_PORT: "${SMTP_PORT-587}"
      SMTP_TIMEOUT_SEC: "${SMTP_TIMEOUT_SEC-20}"
      DB_MAX_CONNS: "${DB_MAX_CONNS-20}"
      DB_MIN_CONNS: "${DB_MIN_CONNS-2}"
      DB_CONN_LIFETIME_MIN: "${DB_CONN_LIFETIME_MIN-30}"
      DB_CONN_IDLE_MIN: "${DB_CONN_IDLE_MIN-5}"
      DB_CONNECT_TIMEOUT_SEC: "${DB_CONNECT_TIMEOUT_SEC-10}"
      DB_STATEMENT_TIMEOUT_SEC: "${DB_STATEMENT_TIMEOUT_SEC-30}"
      AUTH_SESSION_TTL_DAYS: "${AUTH_SESSION_TTL_DAYS-30}"
      AUTH_STUDENT_TTL_DAYS: "${AUTH_STUDENT_TTL_DAYS-180}"
      AUTH_VERIFY_TTL_HOURS: "${AUTH_VERIFY_TTL_HOURS-24}"
      AUTH_RESET_TTL_MIN: "${AUTH_RESET_TTL_MIN-60}"
      AUTH_APPROVE_TTL_DAYS: "${AUTH_APPROVE_TTL_DAYS-30}"
      AUTH_LOGIN_MAX_ATTEMPTS: "${AUTH_LOGIN_MAX_ATTEMPTS-5}"
      AUTH_LOGIN_WINDOW_MIN: "${AUTH_LOGIN_WINDOW_MIN-15}"
      AUTH_ARGON_TIME: "${AUTH_ARGON_TIME-3}"
      AUTH_ARGON_MEMORY_KB: "${AUTH_ARGON_MEMORY_KB-65536}"
      AUTH_ARGON_THREADS: "${AUTH_ARGON_THREADS-2}"
      AUTH_ARGON_KEYLEN: "${AUTH_ARGON_KEYLEN-32}"
      ML_LLM_CHAT_CONCURRENCY: "${ML_LLM_CHAT_CONCURRENCY-16}"
      ML_LLM_BUILD_CONCURRENCY: "${ML_LLM_BUILD_CONCURRENCY-8}"
      ML_ASR_CONCURRENCY: "${ML_ASR_CONCURRENCY-4}"
      ML_TTS_CONCURRENCY: "${ML_TTS_CONCURRENCY-2}"
      ML_MEDIA_CONCURRENCY: "${ML_MEDIA_CONCURRENCY-4}"
      ML_ACQUIRE_TIMEOUT_SEC: "${ML_ACQUIRE_TIMEOUT_SEC-45}"
      ML_COST_IN_MICRO_PER_TOKEN: "${ML_COST_IN_MICRO_PER_TOKEN-90}"
      ML_COST_OUT_MICRO_PER_TOKEN: "${ML_COST_OUT_MICRO_PER_TOKEN-360}"
      LLM_SERVICE_TIMEOUT_SECONDS: "${LLM_SERVICE_TIMEOUT_SECONDS-900}"
      SMTP_HOST: "${SMTP_HOST-}"
      SMTP_FROM: "${SMTP_FROM-}"
      SMTP_USERNAME: "${SMTP_USERNAME-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD-}"
      DATABASE_URL: "${DATABASE_URL-}"
      AUTH_AUTO_APPROVE_EMAILS: "${AUTH_AUTO_APPROVE_EMAILS-}"
      AUTH_APPROVER_EMAILS: "${AUTH_APPROVER_EMAILS-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES-}"
      SCHOOL_TZ: "${SCHOOL_TZ-Europe/Moscow}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE-}"
      DB_MIGRATE_ON_START: "${DB_MIGRATE_ON_START-}"
      DB_REQUIRE_VERSION: "${DB_REQUIRE_VERSION-true}"
      API_READ_TIMEOUT_SECONDS: "${API_READ_TIMEOUT_SECONDS-30}"
      API_WRITE_TIMEOUT_SECONDS: "${API_WRITE_TIMEOUT_SECONDS-960}"
      API_SHUTDOWN_TIMEOUT_SECONDS: "${API_SHUTDOWN_TIMEOUT_SECONDS-30}"
      MAX_AUDIO_SECONDS: "${MAX_AUDIO_SECONDS-300}"
      LIVE_MODEL: "${LIVE_MODEL-gpt-live-1}"
      LIVE_BACKEND_MODEL: "${LIVE_BACKEND_MODEL-gpt-5.4}"
      LIVE_API_BASE_URL: "${LIVE_API_BASE_URL-https://api.openai.com/v1}"
      LIVE_VOICE: "${LIVE_VOICE-delta}"
      LIVE_REASONING_EFFORT: "${LIVE_REASONING_EFFORT-medium}"
      LIVE_CONVERSATION_TOOLS: "${LIVE_CONVERSATION_TOOLS-false}"
  llm:
    environment:
      OPENROUTER_MODEL: "${OPENROUTER_MODEL-qwen/qwen3.7-plus}"
      YANDEX_MODEL: "${YANDEX_MODEL-aliceai-llm}"
      AVATAR_MODEL: "${AVATAR_MODEL-}"
      LLM_PROVIDER: "${LLM_PROVIDER-openrouter}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL-https://openrouter.ai/api/v1}"
      OPENROUTER_REASONING_ENABLED: "${OPENROUTER_REASONING_ENABLED-false}"
      YANDEX_FOLDER_ID: "${YANDEX_FOLDER_ID-}"
      YANDEX_API_KEY: "${YANDEX_API_KEY-}"
      YANDEX_BASE_URL: "${YANDEX_BASE_URL-https://ai.api.cloud.yandex.net/v1}"
      MAX_CONCURRENT_LLM: "${MAX_CONCURRENT_LLM-20}"
      LLM_REQUEST_TIMEOUT_SECONDS: "${LLM_REQUEST_TIMEOUT_SECONDS-300}"
      LLM_CALL_TIMEOUT_SECONDS: "${LLM_CALL_TIMEOUT_SECONDS-90}"
      LLM_HTTP_PROXY: "${LLM_HTTP_PROXY-}"
      LLM_BILLING_RATES_JSON: "${LLM_BILLING_RATES_JSON-}"
  asr:
    environment:
      ASR_API_MODEL: "${ASR_API_MODEL-gpt-transcribe}"
      ASR_USE_API: "${ASR_USE_API-true}"
      ASR_API_BASE_URL: "${ASR_API_BASE_URL-https://api.openai.com/v1}"
      ASR_API_KEY: "${ASR_API_KEY-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY-}"
      ASR_API_LANGUAGE: "${ASR_API_LANGUAGE-english}"
      ASR_API_TIMEOUT_SECONDS: "${ASR_API_TIMEOUT_SECONDS-120}"
      ASR_PORT: "${ASR_PORT-8000}"
      ASR_DEVICE: "${ASR_DEVICE-cpu}"
      ASR_MODEL_FILE: "${ASR_MODEL_FILE-api}"
      ASR_CHUNK_SECONDS: "${ASR_CHUNK_SECONDS-20}"
      ASR_MAX_WORKERS: "${ASR_MAX_WORKERS-2}"
      ASR_REVIEW_MIN_CONFIDENCE: "${ASR_REVIEW_MIN_CONFIDENCE-0.85}"
      ASR_REVIEW_MIN_TOKEN_PROB: "${ASR_REVIEW_MIN_TOKEN_PROB-0.25}"
      ASR_REVIEW_QUIET_DBFS: "${ASR_REVIEW_QUIET_DBFS--40}"
      ASR_REVIEW_MIN_SNR_DB: "${ASR_REVIEW_MIN_SNR_DB-15}"
      ASR_REVIEW_MAX_CLIP_RATIO: "${ASR_REVIEW_MAX_CLIP_RATIO-0.01}"
  tts:
    environment:
      TTS_API_MODEL: "${TTS_API_MODEL-gpt-4o-mini-tts}"
      TTS_USE_API: "${TTS_USE_API-true}"
      TTS_API_BASE_URL: "${TTS_API_BASE_URL-https://api.openai.com/v1}"
      TTS_API_KEY: "${TTS_API_KEY-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY-}"
      TTS_API_VOICE: "${TTS_API_VOICE-alloy}"
      TTS_API_RESPONSE_FORMAT: "${TTS_API_RESPONSE_FORMAT-wav}"
      TTS_API_TIMEOUT_SECONDS: "${TTS_API_TIMEOUT_SECONDS-120}"
      TTS_PORT: "${TTS_PORT-8000}"
      TTS_LANGUAGE: "${TTS_LANGUAGE-ru}"
      TTS_MODEL_ID: "${TTS_MODEL_ID-v5_cis_base_nostress}"
      TTS_SPEAKER: "${TTS_SPEAKER-tat_marat}"
      TTS_SAMPLE_RATE: "${TTS_SAMPLE_RATE-48000}"
      TTS_DEVICE: "${TTS_DEVICE-cpu}"
      TTS_MAX_WORKERS: "${TTS_MAX_WORKERS-1}"
      TTS_MAX_TEXT_LENGTH: "${TTS_MAX_TEXT_LENGTH-5000}"
