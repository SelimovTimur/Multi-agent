# MVP целиком: docker compose up --build, затем http://localhost:8088
#
# Порядок старта: база → миграции → демо-данные → сервисы. Миграции и
# seed — одноразовые контейнеры; seed печатает в лог, как войти:
#   docker compose logs seed

x-db-url: &db-url postgres://native:native@postgres:5432/native?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: native
      POSTGRES_PASSWORD: native
      POSTGRES_DB: native
      # Сортировка не зависит от версии ICU в образе.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U native -d native"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    extends:
      file: settings.compose.yml
      service: api
    build: .
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: *db-url
      APP_ENV: dev
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@example.com}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-english-demo-2026}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Go API: классы, уроки, разговор с аватаром, аналитика.
  api:
    extends:
      file: settings.compose.yml
      service: api
    build: .
    environment:
      DATABASE_URL: *db-url
      APP_ENV: dev
      LOG_FORMAT: text
      AUTH_COOKIE_SECURE: "false"
      PUBLIC_URL: http://localhost:8088
    depends_on:
      seed:
        condition: service_completed_successfully
      llm:
        condition: service_healthy
      asr:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Движок разговора с аватаром.
  llm:
    extends:
      file: settings.compose.yml
      service: llm
    build: ./llm_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Распознавание речи ученика через API.
  asr:
    extends:
      file: settings.compose.yml
      service: asr
    build: ./asr_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Озвучка реплик аватара в режиме голосовых сообщений.
  tts:
    extends:
      file: settings.compose.yml
      service: tts
    build: ./tts_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
